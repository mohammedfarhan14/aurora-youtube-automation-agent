
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-studio-api"
version = "0.1.0"
description = "Backend API for Aurora Studio"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3.0",
    "PyJWT>=2.10,<3.0",
    "cryptography>=50,<51",
    "httpx>=0.28,<1.0",
    "aiohttp>=3.11,<4.0",
    "redis>=5.2,<7.0",
    "Pillow>=13.0.0,<14.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
