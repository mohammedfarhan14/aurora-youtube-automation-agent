# Local-demo HTTPS egress for provider APIs and licensed media sources. The
# media worker has no direct internet route and can reach only this proxy.
# Private/reserved destinations are rejected. Local exceptions are restricted
# to the Qwen TTS bridge on 8880, Kokoro on 8881, and ComfyUI on 8188 at the Docker host alias.
http_port 3128

acl Safe_ports port 443 8880 8881 8188
acl SSL_ports port 443
acl CONNECT method CONNECT
acl qwen_bridge dstdomain host.docker.internal
acl qwen_port port 8880
acl kokoro_bridge dstdomain host.docker.internal
acl kokoro_port port 8881
acl comfyui_bridge dstdomain comfyui.wsl.host
acl comfyui_port port 8188
acl provider_domains dstdomain .wikimedia.org api.elevenlabs.io .r2.cloudflarestorage.com
acl to_private dst \
    0.0.0.0/8 \
    10.0.0.0/8 \
    100.64.0.0/10 \
    127.0.0.0/8 \
    169.254.0.0/16 \
    172.16.0.0/12 \
    192.0.0.0/24 \
    192.0.2.0/24 \
    192.168.0.0/16 \
    198.18.0.0/15 \
    198.51.100.0/24 \
    203.0.113.0/24 \
    224.0.0.0/4 \
    240.0.0.0/4 \
    ::/128 \
    ::1/128 \
    fc00::/7 \
    fe80::/10 \
    ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow qwen_bridge qwen_port
http_access allow kokoro_bridge kokoro_port
http_access allow comfyui_bridge comfyui_port
http_access deny to_private
http_access allow provider_domains
http_access allow CONNECT SSL_ports
http_access deny all

cache deny all
access_log /tmp/access.log
cache_log /tmp/cache.log
cache_store_log none
forwarded_for delete
httpd_suppress_version_string on
visible_hostname aurora-media-egress-proxy
shutdown_lifetime 1 seconds
