# Public HTTPS egress for the local research worker. The worker has no direct
# internet route; only this proxy is reachable. Private and reserved addresses
# are rejected before HTTPS CONNECT.
http_port 3128

acl Safe_ports port 443
acl SSL_ports port 443
acl CONNECT method CONNECT

acl to_private dst \
    0.0.0.0/8 \
    10.0.0.0/8 \
    100.64.0.0/10 \
    127.0.0.0/8 \
    169.254.0.0/16 \
    172.16.0.0/12 \
    192.0.0.0/24 \
    192.0.2.0/24 \
    192.168.0.0/16 \
    198.18.0.0/15 \
    198.51.100.0/24 \
    203.0.113.0/24 \
    224.0.0.0/4 \
    240.0.0.0/4 \
    ::/128 \
    ::1/128 \
    fc00::/7 \
    fe80::/10 \
    ff00::/8

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_private
http_access allow CONNECT SSL_ports
http_access deny all

cache deny all
access_log /tmp/access.log
cache_log /tmp/cache.log
cache_store_log none
forwarded_for delete
httpd_suppress_version_string on
visible_hostname aurora-research-egress-proxy
shutdown_lifetime 1 seconds
