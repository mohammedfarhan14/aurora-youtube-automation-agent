log_format aurora_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout aurora_safe;
    error_log /dev/stderr warn;
    server_tokens off;

    include /etc/nginx/conf.d/aurora-security-headers.inc;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/integrations/youtube/callback {
        # Nginx upstream errors can log the full request line; OAuth callback
        # errors must not write authorization codes or state values to logs.
        error_log /dev/null emerg;
        include /etc/nginx/conf.d/aurora-api-proxy.inc;
    }

    location ^~ /api/ {
        include /etc/nginx/conf.d/aurora-api-proxy.inc;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/aurora-security-headers.inc;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/aurora-security-headers.inc;
    }
}
