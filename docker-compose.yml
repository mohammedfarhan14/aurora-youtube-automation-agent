name: aurora-studio

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    networks:
      - default
      - research-data
      - media-data
      - youtube-data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default
      - research-data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    image: aurora-studio-backend:local
    # Local filesystem media storage is shared with the media and publisher
    # workers; keep their numeric identity consistent across these services.
    user: "996:996"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      YOUTUBE_PUBLISH_WORKER_ENABLED: ${YOUTUBE_PUBLISH_WORKER_ENABLED:-false}
      YOUTUBE_EGRESS_PROXY_URL: http://youtube-egress-proxy:3128
      REDIS_URL: redis://redis:6379/0
      MEDIA_VISUAL_PROXY_URL: http://media-egress-proxy:3128
      MEDIA_STORAGE_ROOT: /app/backend/api/var/media
    volumes:
      - ./backend/api/app:/app/backend/api/app:ro
      # Keep local Alembic commands in sync with the working tree, even when
      # the currently cached development image predates newer migrations.
      - ./backend/api/migrations:/app/backend/api/migrations:ro
      - ./config/comfyui:/app/config/comfyui:ro
      - media_data:/app/backend/api/var/media
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  email-worker:
    profiles: ["app"]
    image: aurora-studio-backend:local
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      YOUTUBE_PUBLISH_WORKER_ENABLED: "false"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/api/app:/app/backend/api/app:ro
    command: ["python", "-m", "app.workers.run_email_outbox"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 90s


  story-production-worker:
    profiles: ["story"]
    image: aurora-studio-backend:local
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      YOUTUBE_PUBLISH_WORKER_ENABLED: "false"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend/api/app:/app/backend/api/app:ro
    command: ["python", "-m", "app.workers.run_story_production_worker"]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 180s

  media-production-worker:
    profiles: ["media"]
    image: aurora-studio-media-worker:local
    networks:
      - media-data
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
      args:
        INSTALL_FFMPEG: "true"
        INSTALL_CHROMIUM: ${MEDIA_INSTALL_CHROMIUM:-true}
    restart: on-failure
    user: "996:996"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      YOUTUBE_PUBLISH_WORKER_ENABLED: "false"
      MEDIA_STORAGE_ROOT: /app/backend/api/var/media
      MEDIA_TTS_PROXY_URL: http://media-egress-proxy:3128
      MEDIA_VISUAL_PROXY_URL: http://media-egress-proxy:3128
      MEDIA_VISUAL_COMPOSER: ${MEDIA_VISUAL_COMPOSER:-pillow}
    mem_limit: 2g
    cpus: 2
    volumes:
      - ./backend/api/app:/app/backend/api/app:ro
      - ./config/comfyui:/app/config/comfyui:ro
      - media_data:/app/backend/api/var/media
    command: ["python", "-m", "app.workers.run_media_production_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      media-egress-proxy:
        condition: service_healthy
    stop_grace_period: 180s

  media-egress-proxy:
    profiles: ["media"]
    image: ubuntu/squid:6.6-24.04_beta
    restart: unless-stopped
    networks:
      default: {}
      media-data:
        aliases:
          - media-egress-proxy
    extra_hosts:
      - "host.docker.internal:${QWEN_TTS_HOST_GATEWAY_IP:-host-gateway}"
      - "comfyui.wsl.host:${COMFYUI_WSL_HOST_IP:-host-gateway}"
    expose:
      - "3128"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/3128'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/squid:rw,noexec,nosuid,size=32m
      - /var/log/squid:rw,noexec,nosuid,size=32m
      - /var/spool/squid:rw,noexec,nosuid,size=32m
    volumes:
      - ./infrastructure/docker/media-egress/squid.conf:/etc/squid/squid.conf:ro

  youtube-egress-proxy:
    profiles: ["youtube-publish"]
    image: ubuntu/squid:6.6-24.04_beta
    restart: unless-stopped
    networks:
      default: {}
      youtube-data:
        aliases:
          - youtube-egress-proxy
    expose:
      - "3128"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/3128'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/squid:rw,noexec,nosuid,size=32m
      - /var/log/squid:rw,noexec,nosuid,size=32m
      - /var/spool/squid:rw,noexec,nosuid,size=32m
    volumes:
      - ./infrastructure/docker/youtube-egress/squid.conf:/etc/squid/squid.conf:ro

  youtube-publish-worker:
    profiles: ["youtube-publish"]
    image: aurora-studio-backend:local
    user: "996:996"
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: on-failure
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    networks:
      - youtube-data
      - media-data
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      YOUTUBE_PUBLISH_WORKER_ENABLED: ${YOUTUBE_PUBLISH_WORKER_ENABLED:-false}
      YOUTUBE_EGRESS_PROXY_URL: http://youtube-egress-proxy:3128
      MEDIA_STORAGE_ROOT: /app/backend/api/var/media
    volumes:
      - ./backend/api/app:/app/backend/api/app:ro
      - media_data:/app/backend/api/var/media
    command: ["python", "-m", "app.workers.youtube_publish_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      youtube-egress-proxy:
        condition: service_healthy
    stop_grace_period: 180s

  research-worker:
    profiles: ["app"]
    image: aurora-studio-backend:local
    networks:
      - research-data
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      YOUTUBE_PUBLISH_WORKER_ENABLED: "false"
      REDIS_URL: redis://redis:6379/0
      RESEARCH_EGRESS_PROXY_URL: http://research-egress-proxy:3128
    volumes:
      - ./backend/api/app:/app/backend/api/app:ro
    command: ["python", "-m", "app.workers.run_research_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      research-egress-proxy:
        condition: service_healthy
    stop_grace_period: 180s

  research-egress-proxy:
    profiles: ["app"]
    image: ubuntu/squid:6.6-24.04_beta
    restart: unless-stopped
    networks:
      default: {}
      research-data:
        aliases:
          - research-egress-proxy
    expose:
      - "3128"
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/127.0.0.1/3128'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /run:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/squid:rw,noexec,nosuid,size=32m
      - /var/log/squid:rw,noexec,nosuid,size=32m
      - /var/spool/squid:rw,noexec,nosuid,size=32m
    volumes:
      - ./infrastructure/docker/research-egress/squid.conf:/etc/squid/squid.conf:ro


networks:
  # Data networks scope workers to their required stores. The research worker
  # remains internal-only and can reach the public sources only through its
  # domain-allowlisted egress proxy. Media remains internal-only.
  research-data:
    internal: true
  media-data:
    internal: true
  youtube-data:
    internal: true

volumes:
  postgres_data:
  media_data:
