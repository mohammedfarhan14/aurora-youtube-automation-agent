name: aurora-studio

# Small-resource overlay for one OCI Always Free Ampere A1 demo VM (2 OCPU,
# 12 GB RAM). Production services remain separated; limits leave room for the
# host OS, Docker, Postgres cache and short-lived build/migration processes.
services:
  postgres:
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 1536M}
        reservations: {memory: 384M}

  redis:
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}
        reservations: {memory: 64M}

  migrate:
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 384M}

  api:
    deploy:
      resources:
        limits: {cpus: "0.75", memory: 1024M}
        reservations: {memory: 256M}

  frontend:
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 128M}
        reservations: {memory: 32M}

  email-worker:
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 256M}
        reservations: {memory: 64M}

  research-worker:
    deploy:
      resources:
        limits: {cpus: "0.40", memory: 512M}
        reservations: {memory: 128M}

  story-worker:
    deploy:
      resources:
        limits: {cpus: "0.60", memory: 768M}
        reservations: {memory: 192M}

  media-worker:
    deploy:
      resources:
        limits: {cpus: "1.00", memory: 2048M}
        reservations: {cpus: "0.25", memory: 512M}

  youtube-publish-worker:
    deploy:
      resources:
        limits: {cpus: "0.50", memory: 512M}
        reservations: {memory: 128M}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN to a DNS name pointed at this VM}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./infrastructure/deployment/oci/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend: {condition: service_healthy}
    networks: [default]
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy_data:
  caddy_config:
