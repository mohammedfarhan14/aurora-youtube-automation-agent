name: Publish immutable application images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish ${{ matrix.name }}
    runs-on: [self-hosted, linux, x64, aurora-ci]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - name: backend
            image: aurora-youtube-automation-agent-backend
            dockerfile: infrastructure/docker/backend.Dockerfile
            install_ffmpeg: "false"
            install_chromium: "false"
          - name: media worker
            image: aurora-youtube-automation-agent-media-worker
            dockerfile: infrastructure/docker/backend.Dockerfile
            install_ffmpeg: "true"
            install_chromium: "true"
          - name: frontend
            image: aurora-youtube-automation-agent-frontend
            dockerfile: infrastructure/docker/frontend.Dockerfile
            install_ffmpeg: "false"
            install_chromium: "false"
    steps:
      - name: Check out release source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for ARM64 image builds
        uses: docker/setup-qemu-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image by source commit SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          build-args: |
            INSTALL_FFMPEG=${{ matrix.install_ffmpeg }}
            INSTALL_CHROMIUM=${{ matrix.install_chromium }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
